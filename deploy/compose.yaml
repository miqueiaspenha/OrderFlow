name: orderflow

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: orderflow-rabbitmq
    hostname: orderflow-rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Usuario obrigatorio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Senha obrigatoria}
      RABBITMQ_DEFAULT_VHOST: orderflow

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  rabbitmq_data: